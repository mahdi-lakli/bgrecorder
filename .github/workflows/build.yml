name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: BGRecorder
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BGRecorder-debug-apk
          path: BGRecorder/app/build/outputs/apk/debug/app-debug.apk
