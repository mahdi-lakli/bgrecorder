name: Build and publish release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret KEYSTORE_BASE64 is missing. Add the 4 secrets first."
            exit 1
          fi
          APP_BUILD=$(find . -type f -path '*/app/build.gradle.kts' | head -n 1)
          if [ -z "$APP_BUILD" ]; then
            echo "app/build.gradle.kts was NOT found. Files in the repository:"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          PROJECT_DIR=$(dirname "$(dirname "$APP_BUILD")")
          echo "Project folder is: $PROJECT_DIR"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          cd "$PROJECT_DIR"
          gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }}
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/BGRecorder.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" out/BGRecorder.apk \
            --target "${{ github.sha }}" \
            --title "Version 1.${{ github.run_number }}" \
            --notes "Automatic build number ${{ github.run_number }}."
